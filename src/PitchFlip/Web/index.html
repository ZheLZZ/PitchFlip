<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://document.local"><title>PitchFlip</title><link rel="stylesheet" href="preview.css"></head><body>
<nav aria-label="PDF 工具栏"><button id="before" data-icon="page" title="页前插入空白（B）">页前空白</button><button id="after" data-icon="page" title="页后插入空白（Shift+B）">页后空白</button><button id="standalone" data-icon="book" title="让所选原 PDF 页面位于正面，背面留空；需要时自动在页前补空白">独占一张纸</button><span class="divider"></span><button id="undo" data-icon="undo" title="撤销（Ctrl+Z）">撤销</button><button id="redo" data-icon="redo" title="重做（Ctrl+Y）">重做</button><span class="toolbar-spacer"></span><button id="openToolbar" class="open-button" data-icon="folder">打开 PDF</button><button id="saveToolbar" class="primary" data-icon="save" disabled>保存副本</button><span class="divider"></span><button id="jump" title="跳转到页面（Ctrl+G）" aria-label="跳转到页面">•••</button></nav>
<main><aside id="sidebar"><header><div class="sidebar-tabs"><button id="physicalTab" class="active">上下页导航</button><button id="overviewToggle" aria-pressed="false" disabled>页面总览</button></div><span id="counts">尚未打开 PDF</span></header><div id="list"></div></aside>
<section id="workspace"><div id="empty"><div class="mark">P / F</div><h1>打印之前，先翻一遍。</h1><p>打开横版 PDF，检查每张纸的正反面。<br>在需要的位置插入空白，保留原始 PDF 质量。</p><button id="open" class="primary">打开 PDF</button><p class="hint">也可以拖入 PDF 文件</p></div>
<div id="bookArea" hidden><div id="topLabel" class="page-label"></div><div id="book"><div id="upper" class="paper upper"></div><div id="lower" class="paper lower"></div><div id="flipper"><div id="front" class="face"></div><div id="back" class="face back"></div></div><div id="binding"><span>顶部装订</span></div></div><div id="bottomLabel" class="page-label"></div></div>
<div id="overview" hidden><div class="overview-bar"><button id="overviewBack">返回翻页</button><strong id="overviewCount"></strong><span>上下双页为一组 · 点击页面查看</span><label>缩略图大小 <input id="overviewSize" type="range" min="150" max="360" value="220"></label></div><div id="overviewScroll" tabindex="0" aria-label="全部页面布局"><div id="overviewGrid"></div></div></div><footer><div class="flip-control previous"><button id="prev" data-icon="left" aria-label="上一张纸"></button><span>上一张纸</span></div><span id="position">封面</span><div class="flip-control following"><button id="next" data-icon="right" aria-label="下一张纸"></button><span>下一张纸</span></div><div class="zoom-toolbar"><button id="zoomOut" data-icon="minus" title="缩小" aria-label="缩小" disabled></button><button id="zoomIn" data-icon="plus" title="放大" aria-label="放大" disabled></button><span class="divider"></span><select id="zoomLevel" aria-label="预览缩放" disabled><option value="0.75">75%</option><option value="1" selected>100%</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="2">200%</option></select><span class="divider"></span><button id="fitWindow" data-icon="fit" disabled>适合窗口</button></div></footer></section>
<aside id="info"><header>当前页面 <span class="privacy" data-icon="shield">完全本地处理</span></header><h3 id="filename">尚未打开文件</h3><div id="details"></div><section class="operations"><h3>操作</h3><div class="action-grid"><button data-command="before" data-icon="page" disabled>页前空白</button><button data-command="after" data-icon="page" disabled>页后空白</button><button data-command="standalone" data-icon="book" disabled>独占一张纸</button><button id="delete" data-icon="trash" disabled>删除此插入页</button></div></section><label class="animation-option"><input id="animation" type="checkbox" checked> 启用翻页动画</label><div class="note"><strong>ⓘ　提示</strong><br>预览为模拟效果，实际打印效果请以打印机设置为准。</div></aside></main>
<dialog id="jumpDialog"><h2>跳转到页面</h2><select id="jumpType"><option value="output">输出 PDF 页码</option><option value="original">原 PDF 页码</option><option value="sheet">物理纸张</option></select><input id="jumpNumber" type="number" min="1" value="1"><p id="jumpError"></p><button id="jumpCancel">取消</button><button id="jumpGo" class="primary">跳转</button></dialog>
<div id="context" hidden><button data-action="before">在此页前插入空白</button><button data-action="after">在此页后插入空白</button><button data-action="standalone">独占一张纸</button><button data-action="delete">删除当前空白页</button></div>
<script type="module" src="preview.js"></script></body></html>
