<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; worker-src 'self' blob:; connect-src 'self' https://document.local"><title>PitchFlip</title><link rel="stylesheet" href="preview.css"></head><body>
<nav><button id="before">＋ 页前空白 <kbd>B</kbd></button><button id="after">页后空白 <kbd>⇧ B</kbd></button><button id="standalone" title="让所选原 PDF 页面位于正面，背面留空；需要时自动在页前补空白">独占一张纸</button><button id="delete">删除空白</button><span class="divider"></span><button id="undo">撤销</button><button id="redo">重做</button><button id="jump">跳转 <kbd>Ctrl G</kbd></button><span class="divider"></span><button id="overviewToggle" aria-pressed="false" disabled>页面总览</button></nav>
<main><aside id="sidebar"><header>物理纸张 <span id="counts"></span></header><div id="list"></div></aside>
<section id="workspace"><div id="empty"><div class="mark">P / F</div><h1>打印之前，先翻一遍。</h1><p>打开横版 PDF，检查每张纸的正反面。<br>在需要的位置插入空白，保留原始 PDF 质量。</p><button id="open" class="primary">打开 PDF</button><p class="hint">也可以拖入 PDF 文件</p></div>
<div id="bookArea" hidden><div id="topLabel" class="page-label"></div><div id="book"><div id="upper" class="paper upper"></div><div id="lower" class="paper lower"></div><div id="flipper"><div id="front" class="face"></div><div id="back" class="face back"></div></div><div id="binding">顶 部 装 订</div></div><div id="bottomLabel" class="page-label"></div></div>
<div id="overview" hidden><div class="overview-bar"><strong id="overviewCount"></strong><span>上下双页为一组 · 与翻页预览一致 · 点击页面查看</span><label>缩略图大小 <input id="overviewSize" type="range" min="150" max="360" value="220"></label></div><div id="overviewScroll" tabindex="0" aria-label="全部页面布局"><div id="overviewGrid"></div></div></div><footer><button id="prev">↑ 上一张</button><span id="position">封面</span><button id="next">向上翻页 ↓</button></footer></section>
<aside id="info"><header>当前页面</header><h3 id="filename">尚未打开文件</h3><div id="details"></div><div class="note">奇数输出页为正面，偶数输出页为背面。<br><br>插入一个空白页，后续页面的正反面会互换。</div><label><input id="animation" type="checkbox" checked> 启用翻页动画</label></aside></main>
<dialog id="jumpDialog"><h2>跳转到页面</h2><select id="jumpType"><option value="output">输出 PDF 页码</option><option value="original">原 PDF 页码</option><option value="sheet">物理纸张</option></select><input id="jumpNumber" type="number" min="1" value="1"><p id="jumpError"></p><button id="jumpCancel">取消</button><button id="jumpGo" class="primary">跳转</button></dialog>
<div id="context" hidden><button data-action="before">在此页前插入空白</button><button data-action="after">在此页后插入空白</button><button data-action="standalone">独占一张纸</button><button data-action="delete">删除当前空白页</button></div>
<script type="module" src="preview.js"></script></body></html>
